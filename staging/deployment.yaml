apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-text=$(RESPONSE_TEXT)"
          ports:
            - containerPort: 5678
          env:
            - name: RESPONSE_TEXT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: RESPONSE_TEXT