apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1      
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-text=$(RESPONSE_TEXT)"
          ports:
            - containerPort: 5678
          env:
            - name: RESPONSE_TEXT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: RESPONSE_TEXT
          readinessProbe: 
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 3 
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"