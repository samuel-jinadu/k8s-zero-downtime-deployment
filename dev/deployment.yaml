apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-text=Hello from the API - v1"
          ports:
            - containerPort: 5678